name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: autoapplier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests on Postgres (compile tests must not skip)
        env:
          PYTHONPATH: src
          AUTOAPPLIER_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/autoapplier_test
        run: |
          set -o pipefail
          python -m pytest -v -rs tests | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "Tests were skipped; pdflatex tests must run in CI." && exit 1; fi

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check extension scripts
        run: for f in extension/*.js; do node --check "$f"; done
      - name: Validate manifest
        run: node -e "const m=require('./extension/manifest.json'); if (m.manifest_version!==3) process.exit(1)"
      - name: JSON-LD parser tests
        run: node --test tests/*.test.js
      - name: Package extension
        run: cd extension && zip -r ../autoapplier-extension.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: autoapplier-extension
          path: autoapplier-extension.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t autoapplier .
      - name: Smoke-test the Compose stack (migrations, account, auth)
        run: |
          key=$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')
          printf 'POSTGRES_PASSWORD=ci\nAUTOAPPLIER_DATA_KEY=%s\n' "$key" > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf localhost:2005/health && break; sleep 2; done
          curl -sf localhost:2005/health | grep -q '"pdflatex_available":true'
          curl -sf localhost:2005/health | grep -q '"database_ok":true'
          token=$(docker compose run --rm -T api python -m backend.admin create-account --label ci | tail -n 1)
          curl -sf localhost:2005/api/me -H "X-AutoApplier-Key: $token" | grep -q '"label":"ci"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:2005/api/me)" = 401
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

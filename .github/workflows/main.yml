name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests (compile tests must not skip)
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python -m pytest -v -rs tests | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "Tests were skipped; pdflatex tests must run in CI." && exit 1; fi

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check extension scripts
        run: for f in extension/*.js; do node --check "$f"; done
      - name: Validate manifest
        run: node -e "const m=require('./extension/manifest.json'); if (m.manifest_version!==3) process.exit(1)"
      - name: JSON-LD parser tests
        run: node --test tests/*.test.js
      - name: Package extension
        run: cd extension && zip -r ../autoapplier-extension.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: autoapplier-extension
          path: autoapplier-extension.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t autoapplier .
      - name: Smoke-test /health
        run: |
          docker run -d --name api -p 8000:8000 -e AUTOAPPLIER_API_KEY=ci autoapplier
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"pdflatex_available":true'
